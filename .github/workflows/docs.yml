name: Docs

# On release, so the site matches what's on npm. Run by hand for docs-only fixes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publishing is staged, so wait until the release is approved on npm.
      # Re-run the job if approval comes later than this.
      - name: Wait for the release on npm
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 350
        run: |
          until npm view "grailwind@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; do
            sleep 60
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
